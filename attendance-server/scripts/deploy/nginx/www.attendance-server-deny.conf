# Tozai Boeki Time Attendance -- block HTTP access to sensitive backend/project directories.
#
# /volume1/web/attendance-server/ and /volume1/web/claude_memory/ sit inside the Web Station
# document root (/volume1/web) and therefore every file under them, including secrets, was
# downloadable over http/https with zero auth. chmod and Synology ACLs CANNOT stop this:
# nginx workers run as uid 1023 (http) with CAP_DAC_READ_SEARCH, which makes
# the kernel bypass all DAC/ACL read checks. The only effective control is to
# refuse the request at the HTTP layer, which is what this file does.
#
# This file is included by conf.d/www.*.conf inside all four public server
# blocks (80 default, 443 default, and the two quickconnect vhosts), BEFORE
# conf.d/.location.webstation.conf. "^~" makes this prefix location win over
# Web Station's "location ~ ^" catch-all regex.
#
# The frontend at /attendance/ is a SIBLING path and is unaffected.
# The Node app also listens directly on :3000/:3443 (a separate process, not
# routed through nginx at all) -- as of 2026-08-04 it has its own matching
# deny middleware in server.js (before the express.static() call) for the
# dotfile/CLAUDE.md paths, since this nginx-layer fix alone doesn't cover
# those two ports. /claude_memory/ and /attendance-server/ are NOT under
# express.static()'s root, so they're only ever reachable via nginx/Web
# Station -- this file is their only exposure surface and their only fix.
#
# Registered via: synow3tool --reg-nginx-confd / --enable-nginx-confd
# Managed copy of record: /volume1/web/Time_Attendance/attendance-server/deploy/nginx/www.attendance-server-deny.conf
# (moved 2026-08-16 from /volume1/web/attendance-server/deploy/nginx/... -- the compatibility
# symlink that used to sit at the old attendance-server path was removed later the same day,
# see the "second addition" section below)
# Added 2026-08-04.

location = /attendance-server {
    include conf.d/.webstation.error_page.default.conf*;
    return 404;
}

location ^~ /attendance-server/ {
    include conf.d/.webstation.error_page.default.conf*;
    access_log off;
    log_not_found off;
    return 404;
}

# 2026-08-04 addition (4th Opus audit): /claude_memory/ holds this project's own memory files,
# including the full security-review history -- worse to leak than the app secrets themselves,
# since it's a map of every vulnerability ever found here. Same exposure mechanism as above.
location = /claude_memory {
    include conf.d/.webstation.error_page.default.conf*;
    return 404;
}

location ^~ /claude_memory/ {
    include conf.d/.webstation.error_page.default.conf*;
    access_log off;
    log_not_found off;
    return 404;
}

# 2026-08-04 addition: block dotfiles across the whole /volume1/web share --
# /attendance/.git/ (full frontend repo + history), /attendance/.claude/settings.local.json,
# /attendance/CLAUDE.md were all downloadable the same way as the secrets above.
# The existing "^~ /.well-known/acme-challenge" prefix location (elsewhere in the base
# template) already wins precedence over this regex location for that one path (^~ prefix
# matches beat any "~" regex location in nginx, regardless of file/declaration order), so
# ACME cert renewal is unaffected.
location ~ /\. {
    access_log off;
    log_not_found off;
    return 404;
}

# 2026-08-04 addition: CLAUDE.md is not a dotfile (doesn't start with ".") so the regex
# above doesn't catch it. Blocked by exact path instead of broadening the dotfile regex,
# to avoid false positives on legitimate paths containing a dot elsewhere in the name.
location = /attendance/CLAUDE.md {
    access_log off;
    log_not_found off;
    return 404;
}

# 2026-08-16 addition: /attendance and /attendance-server are being relocated under a new
# parent folder, /volume1/web/Time_Attendance/, for separation from an unrelated "Company
# Website" project on the same share. Blanket-deny the ENTIRE new parent at the HTTP layer
# (not just the attendance-server/claude_memory subpaths) -- Web Station auto-exposes every
# folder under /volume1/web at a matching URL path by default, confirmed live against a
# sibling folder that this same reorg's audit found: /Company%20Website/Picture/*.jpg
# returned 200. A blanket deny here means the reorg adds ZERO new HTTP surface, and it
# can't be defeated by a subpath someone forgot to list individually.
#
# The old /attendance-server/ and /claude_memory/ rules above are DELIBERATELY retained even
# though the compatibility symlinks that used to live at /volume1/web/attendance and
# /volume1/web/attendance-server were removed 2026-08-16 (both paths are gone entirely now,
# per user's explicit "nothing left outside the new folder" preference) -- kept as harmless
# defense-in-depth in case anything ever recreates a symlink/directory at those paths by
# accident. /claude_memory/ specifically was never part of this migration at all and its rule
# stays regardless.
location = /Time_Attendance {
    include conf.d/.webstation.error_page.default.conf*;
    return 404;
}

location ^~ /Time_Attendance/ {
    include conf.d/.webstation.error_page.default.conf*;
    access_log off;
    log_not_found off;
    return 404;
}

# 2026-08-16 second addition: user decided to fully retire the compatibility symlinks at the
# old /attendance and /attendance-server paths (not keep a permanent one, per the original
# soak-period plan's alternative) -- which means the documented LAN fallback URL
# (http://192.168.100.100/attendance/, see DEVELOPER_HANDOFF.md and app.js's GPS chrome://flags
# hint) needs to keep working at the NEW path instead. This carves an exception into the
# blanket /Time_Attendance/ deny above for the frontend specifically (mirrors the pre-existing
# bare /attendance/ carve-out -- nothing sensitive lives behind this one, it's meant to be
# public). Longest-prefix-match means a ^~ location wins over any other ^~ location by prefix
# length regardless of declaration order, so this is unambiguous even though it's declared
# after the blanket deny. Content matches Web Station's own catch-all handler
# (conf.d/.location.webstation.conf's final `location ~ ^` block) verbatim, since an empty
# location body here would NOT fall through to that -- Web Station proxies to a unix socket,
# it doesn't use a plain nginx `root` directive.
location ^~ /Time_Attendance/attendance/ {
    # IMPORTANT: nginx's ^~ prefix-match precedence means once THIS location wins as the
    # longest matching prefix, it is used unconditionally -- it does NOT fall through to the
    # file-level `location ~ /\.` dotfile regex or the old `location = /attendance/CLAUDE.md`
    # exact-match rule declared earlier in this file (those only apply to requests that don't
    # match a more specific ^~ prefix first, and this one is more specific/longer). Re-block
    # dotfiles (.git/, .claude/settings.local.json, etc.) and CLAUDE.md HERE, inside this same
    # location, as `if` conditions evaluated before the proxy_pass -- this is the only way to
    # keep the existing protection once traffic for this path is captured by this block.
    if ($uri ~ "/\.") { return 404; }
    if ($uri = "/Time_Attendance/attendance/CLAUDE.md") { return 404; }

    proxy_ignore_headers	X-Accel-Redirect;
    proxy_read_timeout		3600s;
    proxy_set_header		X-Forwarded-By	$server_addr;
    proxy_set_header		X-Real-IP		$remote_addr;
    proxy_set_header		X-HTTPS			$https;
    proxy_set_header		X-Port			$server_port;
    proxy_set_header		X-Real-Port		$remote_port;
    proxy_set_header		Host			$http_host;
    proxy_set_header		Upgrade			$http_upgrade;
    proxy_http_version		1.1;
    proxy_intercept_errors	off;
    proxy_redirect          http://         $scheme://;
    error_page 502 /_webstation_/$status.html;
    proxy_pass http://unix:/run/webstation_default.sock;
}
